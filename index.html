<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar</title>
<meta name="theme-color" content="#0C0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<script>try{const t=JSON.parse(localStorage.getItem("radarfc:theme"));if(t&&t!=="system")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Literata:opsz,wght@7..72,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --item:56px;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif; --read:"Literata",Georgia,serif;
  /* oscuro */
  --bg:#0C0F14; --bg-top:#1A2130; --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.10);
  --text:#E9EDF3; --mute:#8D97A8; --accent:#2AE6FF; --accent-soft:rgba(42,230,255,.14); --accent-ink:#CFF8FF; --dot:#FF3EA5;
  --surface:#121722; --surface-text:#DDE3EC; --heading:#FFFFFF; --link:#9FE9FF;
  --wheel:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.025) 60%,rgba(0,0,0,.3));
  --fshadow:0 22px 40px rgba(0,0,0,.55); --floor:.42; --scrim:rgba(3,5,8,.6);
  --label:linear-gradient(135deg,rgba(42,230,255,.10),rgba(124,92,255,.08) 60%,rgba(255,62,165,.08));
  --input:rgba(255,255,255,.05); --err-bg:rgba(255,62,90,.15); --err:#FFC2CC;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF1F6; --bg-top:#FFFFFF; --glass:rgba(16,28,48,.045); --line:rgba(16,28,48,.11);
  --text:#151A23; --mute:#5D6778; --accent:#0091BA; --accent-soft:rgba(0,145,186,.12); --accent-ink:#00506A; --dot:#D81B72;
  --surface:#FFFFFF; --surface-text:#2A313C; --heading:#0E131B; --link:#0077A3;
  --wheel:linear-gradient(90deg,rgba(16,28,48,.06),rgba(255,255,255,.6) 60%,rgba(16,28,48,.04));
  --fshadow:0 18px 30px rgba(20,30,50,.22); --floor:.28; --scrim:rgba(20,28,40,.35);
  --label:linear-gradient(135deg,rgba(0,145,186,.08),rgba(124,92,255,.06) 60%,rgba(216,27,114,.05));
  --input:#FFFFFF; --err-bg:#FCE3E7; --err:#8A1D33;
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    --bg:#EEF1F6; --bg-top:#FFFFFF; --glass:rgba(16,28,48,.045); --line:rgba(16,28,48,.11);
    --text:#151A23; --mute:#5D6778; --accent:#0091BA; --accent-soft:rgba(0,145,186,.12); --accent-ink:#00506A; --dot:#D81B72;
    --surface:#FFFFFF; --surface-text:#2A313C; --heading:#0E131B; --link:#0077A3;
    --wheel:linear-gradient(90deg,rgba(16,28,48,.06),rgba(255,255,255,.6) 60%,rgba(16,28,48,.04));
    --fshadow:0 18px 30px rgba(20,30,50,.22); --floor:.28; --scrim:rgba(20,28,40,.35);
    --label:linear-gradient(135deg,rgba(0,145,186,.08),rgba(124,92,255,.06) 60%,rgba(216,27,114,.05));
    --input:#FFFFFF; --err-bg:#FCE3E7; --err:#8A1D33;
    color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 60% at 20% 0%,var(--bg-top) 0%,var(--bg) 60%);background-color:var(--bg);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100dvh;display:grid;grid-template-columns:1fr 76px;max-width:720px;margin:0 auto}
.main{min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 40px) 16px}

.bar{display:flex;align-items:center;gap:6px;height:40px}
.brand{font-weight:700;font-stretch:112%;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.mode{font-size:12px;color:var(--mute);font-weight:500}
.icon-btn{height:36px;min-width:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line);background:var(--glass);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.icon-btn[hidden]{display:none}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.label{margin:14px 0;padding:12px 16px 14px;border-radius:18px;background:var(--label);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.wdrow{display:flex;justify-content:space-between;align-items:baseline}
.wd,.yr{font-size:13px;font-weight:600;color:var(--mute)}
.date{font-size:clamp(25px,7.4vw,34px);font-weight:750;font-stretch:118%;line-height:1.05;margin-top:2px}

.day{width:100%;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.day[hidden]{display:none}
.count{font-size:28px;font-weight:750;font-stretch:80%;color:var(--accent);line-height:1;min-width:30px;text-align:center}
.count small{display:block;font-size:10.5px;font-weight:500;font-stretch:100%;color:var(--mute);margin-top:3px}
.theme{font-size:14.5px;font-weight:600;line-height:1.3}
.plogos{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.plogos .logo{width:20px;height:20px;box-shadow:none}
.chev{width:18px;height:18px;opacity:.5}

.stage{position:relative;padding:48px 4px 54px;min-height:320px}
.stage::after{content:"";position:absolute;left:4%;right:14%;bottom:8px;height:60px;border-radius:50%;background:var(--fc,#5B3FD9);filter:blur(30px);opacity:var(--floor);pointer-events:none}
.rack{perspective:1200px;perspective-origin:15% 50%;position:relative;z-index:1}
.folder{
  --step:84px;--h:208px;--kk:min(var(--k),6);
  position:relative;display:block;width:90%;height:var(--h);
  margin-top:calc(var(--step) - var(--h));
  border:0;padding:0;background:none;text-align:left;cursor:pointer;color:var(--ink,#fff);
  transform-origin:0 100%;
  transform:translateX(calc(var(--kk) * 8px)) rotateY(-9deg) scale(calc(1 - var(--kk) * .018));
  transition:transform .32s cubic-bezier(.2,.8,.2,1),filter .3s;
  filter:brightness(calc(1 - var(--kk) * .08));
}
.folder:first-child{margin-top:0}
.folder .tab{position:absolute;top:-24px;left:6%;min-width:30%;height:30px;padding:0 14px 0 8px;gap:7px;color:var(--ink,#fff);border-radius:14px 12px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 82%,#fff),var(--c1));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 18px color-mix(in srgb,var(--gl) 45%,transparent);display:flex;align-items:center}
.folder .tab::before{content:"";position:absolute;right:-14px;bottom:0;width:22px;height:18px;background:inherit;clip-path:polygon(0 0,0 100%,100% 100%)}
.folder .body{
  position:absolute;inset:0;border-radius:22px;overflow:hidden;
  background:linear-gradient(158deg,var(--c1) 0%,var(--cm) 55%,var(--c2) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 0 1px rgba(255,255,255,.16),0 0 36px color-mix(in srgb,var(--gl) 40%,transparent),var(--fshadow);
  padding:13px 16px;
}
.folder .body::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 70% at 28% 22%,rgba(255,255,255,.34),transparent 55%);pointer-events:none}
.ftop{position:relative;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;font-stretch:90%;opacity:.95}
.title{position:relative;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;font-weight:700;line-height:1.24;font-stretch:96%;margin-top:7px;max-width:94%}
.meta{position:relative;margin-top:8px;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder:not(:last-child) .title{-webkit-line-clamp:1;font-size:14.5px;margin-top:5px;max-width:92%}
.folder:not(:last-child) .meta{visibility:hidden}
.folder.lift{transform:translateX(calc(var(--kk) * 8px)) rotateY(-3deg) translateY(-22px) scale(1.02);filter:none}
.folder.found .body{animation:pulse .9s ease-in-out 2}
@keyframes pulse{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 3px var(--accent),0 0 60px var(--gl)}}
.folder.in{animation:rise .5s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i) * 50ms)}
@keyframes rise{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}

.logo{width:24px;height:24px;border-radius:28%;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;background:#fff;color:#fff;font-size:12px;font-weight:800;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.logo img{width:100%;height:100%;object-fit:contain;padding:2px;border-radius:22%}
.logo.gen{background:var(--pc,#5A3ED8)}
.logo svg{width:60%;height:60%}
.dots{display:inline-flex;gap:3px;flex:none}
.dots b{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.28}
.dots b.on{opacity:.95}

.empty{text-align:center;padding:40px 18px 30px;color:var(--mute);font-size:14.5px;line-height:1.5}
.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.empty button{margin-top:16px}
.ghost{height:70px;width:90%;margin-top:12px;border-radius:20px;background:linear-gradient(90deg,var(--glass),var(--accent-soft),var(--glass));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

.wheel-wrap{position:relative;height:100dvh}
.wheel{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;background:var(--wheel);border-left:1px solid var(--line);
  -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.band{position:absolute;pointer-events:none;left:6px;right:6px;height:var(--item);top:calc(50% - var(--item) / 2);border-radius:14px;border:1.5px solid var(--accent);background:var(--accent-soft);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.spacer{height:calc(50dvh - var(--item) / 2)}
.d{height:var(--item);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;position:relative;will-change:transform,opacity}
.d .n{font-size:21px;font-weight:700;font-stretch:90%;line-height:1}
.d .m{font-size:10.5px;color:var(--mute);margin-top:3px;font-weight:500}
.d.today .n{color:var(--accent)}
.d.has::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--dot)}

.search{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s}
.search.on{opacity:1;transform:none;pointer-events:auto}
.sbox{display:flex;align-items:center;gap:8px}
.sinput{flex:1;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:23px;background:var(--glass);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.sinput svg{width:18px;height:18px;color:var(--accent);flex:none}
.sinput input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.sinput input::placeholder{color:var(--mute)}
.ftoggle{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute)}
.ftoggle button{border:0;background:none;color:var(--accent);font-weight:650;cursor:pointer;padding:6px 0}
.filters{display:grid;gap:14px;padding:12px 0 4px}
.filters[hidden]{display:none}
.fl{font-size:12.5px;font-weight:650;color:var(--mute);margin-bottom:7px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--glass);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.pill .logo{width:20px;height:20px;box-shadow:none}
.dates{display:flex;gap:8px}
.dates label{flex:1;font-size:12px;color:var(--mute)}
.dates input{display:block;width:100%;margin-top:4px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--input);padding:0 10px;font-size:14px}
.sres{flex:1;overflow-y:auto;overscroll-behavior:contain;margin:8px -14px 0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 30px);border-top:1px solid var(--line)}
.scount{font-size:12.5px;color:var(--mute);padding:12px 0 6px}
.res{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.res .logo{width:32px;height:32px;margin-top:2px;box-shadow:0 0 0 1px var(--line)}
.res b{display:block;font-size:15px;font-weight:650;line-height:1.3}
.res small{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--mute)}
.res .dots{color:var(--accent)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.res.last{background:linear-gradient(90deg,var(--accent-soft),transparent)}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:720px;margin:0 auto;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 18px);display:flex;flex-direction:column;
  background:linear-gradient(158deg,var(--c1,#7C5CFF),var(--cm,#5E4BE8) 55%,var(--c2,#3B47D6));border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.85,.25,1);box-shadow:0 -10px 50px color-mix(in srgb,var(--gl,#7C5CFF) 30%,transparent)}
.sheet.on{transform:none}
.grab{flex:none;padding:10px 0 9px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.65)}
.paper{flex:1;overflow-y:auto;overscroll-behavior:contain;margin:0 8px;background:var(--surface);color:var(--surface-text);border-radius:16px 16px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 32px)}
.x{position:absolute;right:16px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.25);color:#fff;display:grid;place-items:center;cursor:pointer}
.x svg{width:16px;height:16px}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:6px 12px 6px 8px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.back svg{width:15px;height:15px}
.src{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.src .logo{width:34px;height:34px;box-shadow:0 0 0 1px var(--line)}
.src b{display:block;color:var(--heading);font-size:14px}
.paper h2{font-family:var(--read);font-size:24px;line-height:1.22;font-weight:650;margin:14px 0 12px;color:var(--heading)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;font-stretch:92%;padding:5px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.chip .logo{width:18px;height:18px;box-shadow:none;margin-left:-4px}
.sec{margin-top:22px}
.sec h3{font-size:13px;font-weight:700;color:var(--hc,var(--accent));margin:0 0 7px}
.sec p{font-family:var(--read);font-size:16.5px;line-height:1.65;margin:0;max-width:66ch;overflow-wrap:anywhere}
.angle{background:var(--glass);border-left:3px solid var(--hc,var(--accent));padding:12px 14px;border-radius:0 10px 10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px;font-weight:750;font-stretch:88%;color:var(--heading)}
.stat span{font-size:12px;color:var(--mute)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;align-items:center}
.facts dt{color:var(--mute)}
.facts dd{margin:0;font-weight:600}
.facts .dots{color:var(--hc,var(--accent))}
.facts .dots b{width:8px;height:8px}
.acts{display:flex;gap:8px;margin-top:26px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;border:0;font-weight:650;font-size:15px;text-decoration:none;cursor:pointer}
.act.pri{background:linear-gradient(158deg,var(--c1,#7C5CFF),var(--c2,#3B47D6));color:var(--ink,#fff)}
.act.sec2{background:var(--glass);color:var(--text);border:1px solid var(--line)}
.small p{font-size:14px;line-height:1.55;color:var(--mute)}
.paper a{color:var(--link)}
.field{display:block;margin-top:14px;font-size:13px;font-weight:650;color:var(--mute)}
.field input{display:block;width:100%;margin-top:6px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--input);padding:0 12px;font-size:15px}
.help{font-size:13px;line-height:1.5;color:var(--mute);margin:6px 0 0}
.err{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--err-bg);color:var(--err);font-size:13.5px;line-height:1.45}
.err[hidden]{display:none}
.group{margin-top:8px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.th{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--glass);font-size:13px;font-weight:650;cursor:pointer}
.th[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.th i{width:42px;height:28px;border-radius:7px;border:1px solid var(--line)}
.th .tl{background:linear-gradient(135deg,#FFFFFF 50%,#E4E8EF 50%)}
.th .td{background:linear-gradient(135deg,#1A2130 50%,#0C0F14 50%)}
.th .ts{background:linear-gradient(135deg,#FFFFFF 50%,#0C0F14 50%)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.app{grid-template-columns:1fr 88px}}

.pmini{display:none}
.bar .icon-btn{min-width:38px}
.dayline{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-size:13.5px;white-space:nowrap;font-weight:600;color:var(--mute)}
.dayline span{margin-right:auto;overflow:hidden;text-overflow:ellipsis}
.icon-btn.sm{height:30px;min-width:30px;padding:0 8px}
.icon-btn.sm svg{width:15px;height:15px}
.theme small{display:block;font-size:11.5px;font-weight:600;color:var(--mute);margin-bottom:3px}
.theme span{display:block}
.theme .none{color:var(--mute);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:56%;padding:3px 8px;border-radius:10px;background:color-mix(in srgb,var(--ink,#fff) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink,#fff) 22%,transparent);font-size:11px;font-weight:650;font-stretch:90%}
.tag svg{width:11px;height:11px;flex:none}
.tag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag em{font-style:normal;opacity:.8;flex:none}
.favmark{width:14px;height:14px;flex:none;color:#FFD54A;filter:drop-shadow(0 0 4px rgba(0,0,0,.35))}
.star{margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;color:var(--mute);flex:none}
.star svg{width:21px;height:21px}
.star[aria-pressed="true"]{color:#F2B705;border-color:color-mix(in srgb,#F2B705 50%,transparent);background:color-mix(in srgb,#F2B705 14%,transparent)}
.star[aria-pressed="true"] svg{fill:currentColor}
.star.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
button.chip{cursor:pointer}
.chip svg{width:12px;height:12px;flex:none;opacity:.7}
.act svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--heading);color:var(--bg);font-weight:650;font-size:14px;padding:10px 16px;border-radius:20px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* panel de tópicos y favoritos */
.panel{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;transform:translateX(16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.phead{display:flex;align-items:center;gap:8px;min-height:44px}
.phead h1{flex:1;min-width:0;margin:0;font-size:20px;font-weight:750;font-stretch:110%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .icon-btn svg{width:18px;height:18px}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;margin:8px -14px 0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 30px)}
.tcard{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px;margin-top:10px;border-radius:16px;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tic svg{width:19px;height:19px}
.tcard b{display:block;font-size:15.5px;font-weight:650;line-height:1.3}
.tcard small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;font-size:13px;line-height:1.4;color:var(--mute)}
.tcount{font-size:20px;font-weight:750;font-stretch:85%;color:var(--accent);text-align:center;line-height:1}
.tcount small{display:block;font-size:10.5px;font-weight:500;color:var(--mute);margin-top:2px;-webkit-line-clamp:unset}
.tdesc{font-family:var(--read);font-size:16px;line-height:1.6;color:var(--surface-text);margin:6px 0 4px}
.tmeta{font-size:13px;color:var(--mute);margin-bottom:4px}
.res .rt{display:block;margin-top:5px}
.res .rt .chip{font-size:11px;padding:3px 8px}
textarea.in{display:block;width:100%;margin-top:6px;min-height:96px;border-radius:10px;border:1px solid var(--line);background:var(--input);padding:10px 12px;font:15px/1.45 var(--ui);color:inherit;resize:vertical}
.act.danger{background:#D93A3A;color:#fff}
.confirm{font-size:15px;line-height:1.55;color:var(--surface-text)}
.seg2{display:flex;gap:8px;margin-top:8px}
.seg2 .th{flex:1;flex-direction:row;justify-content:center;padding:12px 6px}

.folder{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.folder .tab .logo{width:22px;height:22px}
.unread{position:absolute;top:-5px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 10px var(--accent)}
.res .unread-row{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:2px}
.ftop{min-height:22px}
.folder.dragging{transition:none!important}
.folder .body::after{content:attr(data-arm);position:absolute;left:16px;bottom:12px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:rgba(0,0,0,.35);color:#fff;opacity:0;transition:opacity .15s}
.folder.armed .body::after{opacity:1}
.folder:not(:last-child).armed .body::after{bottom:auto;top:12px}
.stage.archived .folder{filter:saturate(.32) brightness(.82)!important;opacity:.9}
.stage.archived::after{opacity:.12}
.chip.arch{background:color-mix(in srgb,var(--mute) 18%,transparent)}
.trashfab{position:fixed;z-index:12;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);right:calc(max(0px,(100vw - 720px) / 2) + 90px);width:54px;height:54px;border-radius:17px;border:1px solid var(--line);background:var(--surface);color:var(--text);box-shadow:0 10px 24px rgba(0,0,0,.32);display:grid;place-items:center;cursor:pointer}
.trashfab svg{width:25px;height:25px}
.trashfab .badge{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--dot);color:#fff;font-size:11.5px;font-weight:750;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.trashfab .badge[hidden]{display:none}
.trashfab.bump{animation:bump .5s ease}
@keyframes bump{25%{transform:scale(1.16) rotate(-7deg)}55%{transform:scale(.94) rotate(3deg)}80%{transform:scale(1.03)}}
@media (min-width:700px){.trashfab{right:calc(max(0px,(100vw - 720px) / 2) + 102px)}.toasts{right:calc(max(0px,(100vw - 720px) / 2) + 102px)!important}}
.toasts{position:fixed;z-index:40;left:calc(max(0px,(100vw - 720px) / 2) + 14px);right:calc(max(0px,(100vw - 720px) / 2) + 90px);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ut{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.28);font-size:14px;font-weight:500;animation:tin .28s cubic-bezier(.2,.9,.3,1.2)}
.ut svg{width:17px;height:17px;flex:none;color:var(--mute)}
.ut button{border:0;background:none;padding:0;font-weight:800;color:var(--accent);cursor:pointer;font-size:14px}
.ut.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(8px) scale(.96)}}
.fly{position:fixed;z-index:30;border-radius:18px;background:linear-gradient(158deg,var(--c1),var(--cm) 55%,var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 30px color-mix(in srgb,var(--gl) 45%,transparent);pointer-events:none;display:flex;align-items:flex-start;padding:14px;transform-origin:50% 50%}
.fly .logo{width:28px;height:28px}
.drow{display:flex;justify-content:flex-end;margin-top:12px}
.sq{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);display:grid;place-items:center;cursor:pointer}
.sq svg{width:22px;height:22px}
.act.restore{flex:none;padding:0 20px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.tseg{display:flex;gap:6px;margin:6px 0 4px}
.setup{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.setup[hidden]{display:none}
.setup .box{width:100%;max-width:420px}
.setup img{width:64px;height:64px;border-radius:16px}
.setup h1{font-size:24px;font-stretch:110%;margin:16px 0 6px}
.setup p{color:var(--mute);font-size:14.5px;line-height:1.5;margin:0 0 6px}

</style>
</head>

<div class="app">
  <main class="main" id="main">
    <div class="bar">
      <div class="brand"><i></i>Radar</div>
      <button class="icon-btn" id="searchBtn" aria-label="Buscar hallazgos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="topicsBtn" aria-label="Mis tópicos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="favsBtn" aria-label="Favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Configuración"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </div>
    <div class="dayline"><span id="dl"></span>
      <button class="icon-btn sm" id="todayBtn" hidden>Hoy</button>
      <button class="icon-btn sm" id="refreshBtn" aria-label="Actualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>

</div>

    <button class="icon-btn" id="searchClose">Cerrar</button>
  </div>

</div>

const SND={ctx:null,on:load('sound')!==false,noise:null,last:0};
function actx(){
  if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C();
    const n=SND.ctx.createBuffer(1,SND.ctx.sampleRate*.5,SND.ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SND.noise=n}
  if(SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx;
}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>{if(SND.on)actx()},{passive:true,capture:true}));
function env(c,t,peak,a,d){const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);g.connect(c.destination);return g}
function nz(c,t,f0,f1,q,peak,a,d){const s=c.createBufferSource();s.buffer=SND.noise;const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;
  bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+a+d);s.connect(bp).connect(env(c,t,peak,a,d));s.start(t,Math.random()*.3);s.stop(t+a+d+.02)}
function tn(c,t,type,f0,f1,peak,a,d){const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+a+d);o.connect(env(c,t,peak,a,d));o.start(t);o.stop(t+a+d+.02)}
const ready=()=>SND.on&&SND.ctx&&SND.ctx.state==='running';
function sTick(){if(!ready())return;const c=SND.ctx,t=c.currentTime;if(t-SND.last<.03)return;SND.last=t;
  nz(c,t,3800,2600,6,.2,.001,.018);tn(c,t,'triangle',2300,1400,.05,.001,.02);tn(c,t+.004,'sine',260,180,.07,.002,.03)}
function sOpen(){if(!ready())return;const c=SND.ctx,t=c.currentTime;nz(c,t,650,2300,1.4,.06,.025,.14);tn(c,t+.03,'sine',520,820,.035,.01,.12)}
function sClose(){if(!ready())return;const c=SND.ctx,t=c.currentTime;nz(c,t,1900,520,1.4,.05,.015,.12);tn(c,t+.06,'sine',260,170,.06,.005,.1)}

/* ===== Airtable ===== */
const url=(table,q)=>`https://api.airtable.com/v0/${AIRTABLE.base}/${encodeURIComponent(table)}${q?'?'+q:''}`;
async function at(table,params){
  const out=[];let offset;
  do{
    const q=new URLSearchParams();
    for(const [k,v] of Object.entries(params))(Array.isArray(v)?v:[v]).forEach(x=>q.append(k,x));
    if(offset)q.set('offset',offset);
    const go=()=>fetch(url(table,q),{headers:{Authorization:`Bearer ${S.token}`}});
    let res=await go();if(res.status===429){await new Promise(r=>setTimeout(r,1200));res=await go()}
    if(!res.ok)throw apiErr(res.status,table);
    const j=await res.json();out.push(...j.records);offset=j.offset;
  }while(offset);
  return out;
}
/* Las escrituras van en fila para respetar el límite de Airtable (5 por segundo) */
const WQ=[];let wBusy=false;
function atWrite(method,table,body,query){
  return new Promise((resolve,reject)=>{WQ.push({method,table,body,query,resolve,reject});pumpW()});
}
async function pumpW(){
  if(wBusy)return;wBusy=true;
  while(WQ.length){
    const j=WQ.shift();
    try{
      let res=await fetch(url(j.table,j.query),{method:j.method,headers:{Authorization:`Bearer ${S.token}`,'Content-Type':'application/json'},body:j.body?JSON.stringify(j.body):undefined});
      if(res.status===429){await new Promise(r=>setTimeout(r,1500));WQ.unshift(j);continue}
      if(!res.ok){let detail='';try{detail=(await res.json()).error?.message||''}catch(e){}throw apiErr(res.status,j.table,true,detail)}
      j.resolve(await res.json());
    }catch(e){j.reject(e)}
    await new Promise(r=>setTimeout(r,220));
  }
  wBusy=false;
}
function apiErr(code,table,write,detail){
  let m;
  if(code===401)m='El token no es válido o fue revocado.';
  else if(code===403)m=write?`El token no tiene permiso para modificar "${table}". Agrégale data.records:write en Airtable.`:`El token no tiene acceso a la tabla "${table}".`;
  else if(code===404)m=`No se encontró la tabla "${table}" en la base.`;
  else if(code===422)m=`Airtable rechazó la operación en "${table}"${detail?': '+detail:''}.`;
  else if(code===429)m='Airtable está limitando las consultas. Espera unos segundos.';
  else m=`Airtable respondió con un error (${code}).`;
  const e=new Error(m);e.code=code;if(code===401)showSetup(m);return e;
}
const rec=r=>({...r.fields,_id:r.id});

  S.daily={};recs.forEach(r=>{const d=r.fields[F.d.day];if(d)S.daily[String(d).slice(0,10)]=r.fields});
  save('daily',{t:Date.now(),v:S.daily});
}

function eachCopy(id,fn){

const wheel=$('wheel');let H=56,ticking=false,settleT,items=[];
const hasData=d=>!!S.daily[d]||(S.radar[d]&&S.radar[d].length>0);
function buildWheel(keep){
  const ds=Object.keys(S.daily).sort();
  let start=parse(addDays(TODAY,-90)),end=parse(addDays(TODAY,45));
  const want=[...ds,keep].filter(Boolean).sort();
  if(want.length){const a=parse(addDays(want[0],-7)),b=parse(addDays(want[want.length-1],7));if(a<start)start=a;if(b>end)end=b}
  S.dates=[];for(const d=new Date(start);d<=end;d.setDate(d.getDate()+1))S.dates.push(iso(d));
  wheel.innerHTML='<div class="spacer"></div>'+S.dates.map((d,i)=>{const x=parse(d);
    return `<div class="d${d===TODAY?' today':''}${hasData(d)?' has':''}" data-i="${i}"><span class="n">${x.getDate()}</span><span class="m">${MSHORT[x.getMonth()]}</span></div>`}).join('')+'<div class="spacer"></div>';
  items=[...wheel.querySelectorAll('.d')];H=items[0].getBoundingClientRect().height||56;
  const t=Math.max(0,S.dates.indexOf(keep||TODAY));S.idx=t;wheel.scrollTop=t*H;paintWheel();preview(S.dates[t]);return S.dates[t];
}
function paintWheel(){
  ticking=false;const pos=wheel.scrollTop/H,c=Math.round(pos);
  for(let i=Math.max(0,c-9);i<=Math.min(items.length-1,c+9);i++){const o=i-pos,el=items[i];
    el.style.transform=`perspective(380px) rotateX(${(-o*17).toFixed(1)}deg) scale(${(1-Math.min(Math.abs(o),5)*.04).toFixed(3)})`;
    el.style.opacity=Math.max(.12,1-Math.abs(o)*.16).toFixed(2)}
  if(c!==S.idx&&S.dates[c]){S.idx=c;preview(S.dates[c]);sTick();if(navigator.vibrate)navigator.vibrate(3)}
}
wheel.addEventListener('scroll',()=>{
  if(!ticking){ticking=true;requestAnimationFrame(paintWheel)}
  clearTimeout(settleT);settleT=setTimeout(()=>{if(Date.now()<S.lock)return;const d=S.dates[Math.round(wheel.scrollTop/H)];if(d&&d!==S.selected)select(d)},160);
},{passive:true});

/* ===== Arrastrar carpetas (archivar / restaurar) ===== */
function swipe(container,{leftOnly,enabled,onCommit}){
  let st=null;
  container.addEventListener('pointerdown',e=>{
    if(enabled&&!enabled())return;const f=e.target.closest('.folder');if(!f||e.button>0)return;
    st={f,x0:e.clientX,y0:e.clientY,id:e.pointerId,mode:null,dx:0};
  });
  container.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    const dx=e.clientX-st.x0,dy=e.clientY-st.y0;
    if(!st.mode){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){st.mode='h';try{st.f.setPointerCapture(e.pointerId)}catch(_){};st.f.classList.add('dragging');st.z=st.f.style.zIndex;st.f.style.zIndex=999}
      else if(Math.abs(dy)>10){st=null;return}else return;
    }
    const w=st.f.offsetWidth;let d=dx;if(leftOnly&&d>0)d*=.2;
    st.dx=d;const p=Math.min(1,Math.abs(d)/(w*.38));
    st.f.style.translate=`${d}px ${leftOnly?-p*18:p*6}px`;st.f.style.rotate=`${(d/w*7).toFixed(2)}deg`;st.f.style.opacity=(1-p*.3).toFixed(2);
    const armed=p>=1&&(!leftOnly||d<0);if(armed!==st.f.classList.contains('armed')){st.f.classList.toggle('armed',armed);if(navigator.vibrate)navigator.vibrate(armed?8:3)}
  });
  const end=e=>{
    if(!st||e.pointerId!==st.id)return;const s=st;st=null;if(s.mode!=='h')return;
    S.noClick=Date.now()+350;s.f.classList.remove('dragging');
    if(s.f.classList.contains('armed')){s.f.classList.remove('armed');onCommit(s.f,s.dx)}
    else{s.f.style.transition='translate .3s cubic-bezier(.2,.9,.3,1.2),rotate .3s,opacity .3s';s.f.style.translate='';s.f.style.rotate='';s.f.style.opacity='';
      setTimeout(()=>{s.f.style.transition='';s.f.style.zIndex=s.z},320)}
  };
  container.addEventListener('pointerup',end);container.addEventListener('pointercancel',end);
}
swipe(rack,{onCommit:(el)=>archive(S.main[+el.dataset.i],el)});
swipe($('pBody'),{leftOnly:true,enabled:()=>S.layers[S.layers.length-1]==='trash',onCommit:(el)=>restore(S.trash[+el.dataset.i],el)});

function flyToTrash(el,r){
  const body=el.querySelector('.body'),a=body.getBoundingClientRect(),b=$('trashBtn').getBoundingClientRect();
  const g=document.createElement('div');g.className='fly';g.style.cssText=`${brandVars(plat(one(r[F.r.platform])))};left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px`;
  g.innerHTML=logoHTML(one(r[F.r.platform])||'');document.body.appendChild(g);el.style.visibility='hidden';
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),rot=dx>0?14:-14;
  const anim=g.animate([
    {transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},
    {offset:.38,transform:`translate(${dx*.3}px,${dy*.12-36}px) scale(.42) rotate(${rot}deg)`,opacity:1},
    {offset:.85,transform:`translate(${dx}px,${dy-10}px) scale(.1) rotate(${rot*2}deg)`,opacity:1},
    {transform:`translate(${dx}px,${dy+4}px) scale(.04) rotate(${rot*2}deg)`,opacity:0}
  ],{duration:680,easing:'cubic-bezier(.45,.05,.55,.95)'});
  return anim.finished.then(()=>{g.remove();const t=$('trashBtn');t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump');sDrop()});
}
async function archive(r,el){
  if(!r)return;const prev=status(r);
  sSwoosh(false);
  const done=el?flyToTrash(el,r):Promise.resolve();
  setLocalStatus(r,ST.archivado);
  done.then(()=>{refreshMain(false);if(S.layers.includes('trash'))renderTrash()});
  notify('Hallazgo archivado: ',{icon:ICON.trash,undo:()=>{setStatus(r,prev);setTimeout(()=>{refreshMain(false);if(S.layers.includes('trash'))renderTrash()},20)}});
  try{await atWrite('PATCH',AIRTABLE.radar,{records:[{id:r._id,fields:{[F.r.status]:ST.archivado}}],typecast:true})}
  catch(e){setLocalStatus(r,prev);refreshMain(false);toast('No se pudo archivar: '+e.message)}
}
async function restore(r,el){
  if(!r)return;sSwoosh(true);
  if(el){el.style.transition='none';await el.animate([{translate:el.style.translate||'0 0',opacity:+el.style.opacity||1},{translate:'-115% -90px',rotate:'-10deg',opacity:0}],{duration:420,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished}
  const ok=setStatus(r,ST.revisado);
  renderTrash();refreshMain(false);toast('Hallazgo restaurado');await ok;
}

}

/* ===== Filas de resultados ===== */
function rowHTML(r,i,ctx){
  const p=one(r[F.r.platform])||'Otra',names=topicNames(r);
  return `<button class="res${S.lastRes===r._id?' last':''}" data-k="${i}">${logoHTML(p)}<span><b>${isNew(r)?'<i class="unread-row"></i>':''}${ctx==='search'?hl(r[F.r.title]):esc(r[F.r.title])}</b>
    <small>${shortDate(dayOf(r))}<span>${esc(p)}</span>${dots(+r[F.r.relevance]||0)}${isFav(r)?`<span class="favmark">${ICON.starFill}</span>`:''}</small>
    ${(isArch(r)||(ctx!=='topic'&&names.length))?`<span class="rt">${isArch(r)?'<span class="chip arch">Archivado</span> ':''}${ctx!=='topic'?names.map(n=>`<span class="chip">${ICON.tag}${esc(n)}</span>`).join(' '):''}</span>`:''}</span></button>`;
}
async function gotoResult(r){
  S.lastRes=r._id;
  if(isArch(r)){openItem(r);return}
  hidePanels();
  const day=dayOf(r);
  if(!S.dates.includes(day))buildWheel(day);
  const i=S.dates.indexOf(day),far=Math.abs(i-S.idx)>40;
  S.lock=Date.now()+1500;wheel.scrollTo({top:i*H,behavior:far?'auto':'smooth'});
  await select(day);
  let idx=S.main.findIndex(x=>x._id===r._id);
  const el=idx>=0&&rack.querySelector(`.folder[data-i="${idx}"]`);
  if(!el){openItem(r);return}
  el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('found');
  setTimeout(()=>{el.classList.remove('found');openItem(S.main[idx])},900);
}

/* ===== Búsqueda ===== */
const REL=[[0,'Todas'],[3,'3 o más'],[4,'4 o más'],[5,'Solo 5']];
const QUICK=[[7,'Últimos 7 días'],[30,'Últimos 30 días'],[0,'Todo']];
function platformList(){
  const set=new Set(['X','YouTube','LinkedIn','Substack']);
  Object.values(S.daily).forEach(d=>arr(d[F.d.platforms]).forEach(p=>set.add(p)));
  Object.values(S.radar).flat().forEach(r=>{const p=one(r[F.r.platform]);if(p)set.add(p)});
  return [...set];
}
const hasFilters=()=>S.q.rel||S.q.from||S.q.to||S.q.plats.length||S.q.tops.length;
function renderFilters(){
  const q=S.q;
  $('fTop').innerHTML=topicList().map(t=>`<button class="pill" data-top="${esc(t.name)}" aria-pressed="${q.tops.includes(t.name)}">${esc(t.name)}</button>`).join('')||'<span class="help">Sin tópicos cargados.</span>';
  $('fRel').innerHTML=REL.map(([v,l])=>`<button class="pill" data-rel="${v}" aria-pressed="${q.rel===v}">${l}</button>`).join('');
  $('fQuick').innerHTML=QUICK.map(([v,l])=>`<button class="pill" data-quick="${v}">${l}</button>`).join('');
  $('fPlat').innerHTML=platformList().map(p=>`<button class="pill" data-plat="${esc(p)}" aria-pressed="${q.plats.includes(p)}">${logoHTML(p)}${esc(p)}</button>`).join('');
  $('fFrom').value=q.from;$('fTo').value=q.to;
  const n=(q.tops.length?1:0)+(q.rel?1:0)+(q.from||q.to?1:0)+(q.plats.length?1:0);
  $('fToggle').textContent=n?`Filtros (${n})`:'Filtros';
  const parts=[];if(q.tops.length)parts.push(q.tops.join(', '));if(q.rel)parts.push(`relevancia ${q.rel}+`);if(q.from||q.to)parts.push(`${q.from?shortDate(q.from):'inicio'} a ${q.to?shortDate(q.to):'hoy'}`);if(q.plats.length)parts.push(q.plats.join(', '));
  $('fSummary').textContent=parts.join(' | ');
}
function openSearch(){$('q').value=S.q.text;openView('search');setTimeout(()=>$('q').focus(),150);if(!S.results&&(S.q.text||hasFilters()))runSearch();else if(!S.results)renderResults()}
$('searchBtn').onclick=()=>{if(!S.topicsLoaded)loadTopics().then(renderFilters,()=>{});openSearch()};
$('searchClose').onclick=closeTop;
$('fToggle').onclick=()=>{$('filters').hidden=!$('filters').hidden};
let qT;
$('q').addEventListener('input',()=>{S.q.text=$('q').value;clearTimeout(qT);qT=setTimeout(runSearch,650)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(qT);runSearch();$('q').blur()}});
$('filters').addEventListener('click',e=>{
  const b=e.target.closest('.pill');if(!b)return;const q=S.q;
  if(b.dataset.top!=null){const n=b.dataset.top;q.tops=q.tops.includes(n)?q.tops.filter(x=>x!==n):[...q.tops,n]}
  if(b.dataset.rel!=null)q.rel=+b.dataset.rel;
  if(b.dataset.quick!=null){const v=+b.dataset.quick;q.from=v?addDays(TODAY,-(v-1)):'';q.to=v?TODAY:''}
  if(b.dataset.plat!=null){const p=b.dataset.plat;q.plats=q.plats.includes(p)?q.plats.filter(x=>x!==p):[...q.plats,p]}
  renderFilters();runSearch();
});
['fFrom','fTo'].forEach(id=>$(id).addEventListener('change',()=>{S.q.from=$('fFrom').value;S.q.to=$('fTo').value;renderFilters();runSearch()}));
const SEARCH_FIELDS=[F.r.title,F.r.desc,F.r.why,F.r.angle,F.r.author,F.r.niche,F.r.platform,F.r.topic];
function formula(q){
  const parts=[],t=fold(q.text).trim().replace(/["\\]/g,'');
  if(t){let expr='LOWER('+SEARCH_FIELDS.map(f=>`{${f}}&""`).join('&" "&')+')';
    [['á','a'],['é','e'],['í','i'],['ó','o'],['ú','u'],['ü','u']].forEach(([a,b])=>expr=`SUBSTITUTE(${expr},"${a}","${b}")`);
    t.split(/\s+/).forEach(w=>parts.push(`SEARCH("${w}",${expr})`))}
  if(q.tops.length)parts.push(`OR(${q.tops.map(n=>`FIND("${n.replace(/"/g,'')}",{${F.r.topic}}&"")`).join(',')})`);
  if(q.rel)parts.push(`{${F.r.relevance}}>=${q.rel}`);
  const df=`DATETIME_FORMAT({${F.r.date}},'YYYY-MM-DD')`;
  if(q.from)parts.push(`${df}>='${q.from}'`);if(q.to)parts.push(`${df}<='${q.to}'`);
  if(q.plats.length)parts.push(`OR(${q.plats.map(p=>`{${F.r.platform}}&""="${p.replace(/"/g,'')}"`).join(',')})`);
  return parts.length?`AND(${parts.join(',')})`:'';
}
const SCACHE={};let sSeq=0;
async function runSearch(){
  const q=S.q;save('q',q);
  if(!q.text.trim()&&!hasFilters()){S.results=null;renderResults();return}
  const key=JSON.stringify(q),seq=++sSeq;$('sres').innerHTML='<div class="scount">Buscando…</div>';
  try{
    let res=SCACHE[key];
    if(!res){res=(await at(AIRTABLE.radar,{filterByFormula:formula(q),'fields[]':Object.values(F.r),pageSize:100,maxRecords:300})).map(rec).sort(byDate);SCACHE[key]=res}
    if(seq!==sSeq)return;S.results=res;S.scroll.search=0;renderResults();
  }catch(e){if(seq===sSeq)$('sres').innerHTML=`<div class="empty"><strong>No se pudo buscar</strong>${esc(e.message)}</div>`}
}
function hl(s){
  const ws=fold(S.q.text).trim().split(/\s+/).filter(w=>w.length>1);if(!ws.length)return esc(s);
  const f=fold(s),marks=[];ws.forEach(w=>{let i=f.indexOf(w);while(i>=0){marks.push([i,i+w.length]);i=f.indexOf(w,i+1)}});
  if(!marks.length)return esc(s);marks.sort((a,b)=>a[0]-b[0]);
  let r='',p=0;marks.forEach(([a,b])=>{if(a<p)return;r+=esc(s.slice(p,a))+'<mark>'+esc(s.slice(a,b))+'</mark>';p=b});return r+esc(s.slice(p));
}
function renderResults(){
  const res=S.results;
  if(!res){$('sres').innerHTML='<div class="empty">Escribe una palabra o usa los filtros para buscar entre todas las fechas y carpetas.</div>';return}
  if(!res.length){$('sres').innerHTML='<div class="empty"><strong>Sin resultados</strong>Prueba con otra palabra o quita algún filtro.</div>';return}
  $('sres').innerHTML=`<div class="scount">${res.length} ${res.length===1?'hallazgo':'hallazgos'}</div>`+res.map((r,i)=>rowHTML(r,i,'search')).join('');
}
$('sres').addEventListener('click',e=>{const b=e.target.closest('.res');if(b&&S.results)gotoResult(S.results[+b.dataset.k])});

$('pClose').onclick=closeTop;
$('topicsBtn').onclick=()=>openView('topics');
$('favsBtn').onclick=()=>openView('favs');

/* ===== Tema ===== */
let THEME=load('theme')||'system';
const mq=matchMedia('(prefers-color-scheme: light)');
function applyTheme(t){THEME=t;save('theme',t);
  if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
  document.querySelector('meta[name="theme-color"]').content=(t==='light'||(t==='system'&&mq.matches))?'#EEF1F6':'#0C0F14'}
mq.addEventListener?.('change',()=>{if(THEME==='system')applyTheme('system')});
applyTheme(THEME);

/* ===== Configuración ===== */
function openSettings(){
  setSheetColor(PLAT_DEFAULT);
  $('paper').innerHTML=`
    <div class="src"><div><b>Configuración</b>Se guarda solo en este dispositivo.</div></div>
    <h2>Apariencia</h2>
    <div class="group"><div class="themes" id="themes">
      ${[['light','Claro','tl'],['dark','Oscuro','td'],['system','Predeterminado','ts']].map(([v,l,k])=>`<button class="th" data-t="${v}" aria-pressed="${THEME===v}"><i class="${k}"></i>${l}</button>`).join('')}
    </div><p class="help">Predeterminado sigue el tema claro u oscuro de tu teléfono.</p></div>
    <h2>Sonidos</h2>
    <div class="group" style="border:0"><div class="seg2" id="snd">
      <button class="th" data-s="1" aria-pressed="${SND.on}">Activados</button><button class="th" data-s="0" aria-pressed="${!SND.on}">Desactivados</button>
    </div><p class="help">Clic al girar la rueda de fechas y sonidos cortos al abrir, cerrar y archivar carpetas. En iPhone no suenan con el teléfono en silencio.</p></div>`;
  showSheet('settings');
  $('themes').onclick=e=>{const b=e.target.closest('.th');if(!b)return;applyTheme(b.dataset.t);$('themes').querySelectorAll('.th').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('snd').onclick=e=>{const b=e.target.closest('.th');if(!b)return;SND.on=b.dataset.s==='1';save('sound',SND.on);$('snd').querySelectorAll('.th').forEach(x=>x.setAttribute('aria-pressed',x===b));if(SND.on){actx();setTimeout(sTick,60)}};
}
$('settingsBtn').onclick=openSettings;
$('todayBtn').onclick=()=>goTo(TODAY);
$('refreshBtn').onclick=async()=>{
  const b=$('refreshBtn');b.classList.add('spin');
  try{await loadDaily(true);await loadTopics(true).catch(()=>{});S.topicRecs={};S.favList=null;S.archAll=null;for(const k in SCACHE)delete SCACHE[k];const d=buildWheel(S.selected);await select(d,true)}
  catch(e){rack.innerHTML=`<div class="empty"><strong>No se pudo actualizar</strong>${esc(e.message)}</div>`}
  b.classList.remove('spin');
};

/* ===== Conexión inicial ===== */
function showSetup(msg){$('setup').hidden=false;const e=$('sErr');if(msg){e.textContent=msg;e.hidden=false}else e.hidden=true}
$('sGo').onclick=async()=>{
  const t=$('sTok').value.trim();if(!t){showSetup('Pega tu token para continuar.');return}
  S.token=t;$('sGo').textContent='Conectando…';
  try{await loadDaily(true);save('token',t);$('setup').hidden=true;start()}
  catch(e){$('sErr').textContent=e.message;$('sErr').hidden=false}
  $('sGo').textContent='Conectar';
};
async function migrateLocalFavs(){ // favoritos guardados por la versión anterior → Estado en Airtable
  const old=load('favs');if(!old)return;localStorage.removeItem(LS+'favs');
  for(const id of Object.keys(old)){try{await atWrite('PATCH',AIRTABLE.radar,{records:[{id,fields:{[F.r.status]:ST.favorito}}],typecast:true})}catch(e){}}
}

/* ===== Inicio ===== */
async function start(){
  if(!S.token){showSetup();return}
  await Promise.allSettled([loadDaily(false),loadTopics(false)]);
  const d=buildWheel(TODAY);select(d);migrateLocalFavs();
}
window.addEventListener('resize',()=>{if(items[0]){H=items[0].getBoundingClientRect().height;wheel.scrollTop=S.dates.indexOf(S.selected)*H;paintWheel()}});
history.replaceState({n:0},'');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
